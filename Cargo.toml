[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/client", "crates/launcher"]

[workspace.package]
version = "2.3.1"
edition = "2021"
license = "MIT"

# Debug-Builds sonst zu langsam (Labyrinth-Grafik, Bots)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
