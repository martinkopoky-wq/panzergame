# Baut Launcher, Spielpaket und Server für alle Systeme.
#   Tag v*         bauen, testen und als GitHub-Release veröffentlichen (Version muss zu Cargo.toml passen)
#   andere Pushes  nur bauen und testen, wenn sich die Pakete ändern: Ergebnis als Actions-Artefakt
name: Release

on:
  push:
    tags: ["v*"]
    branches-ignore: [main]
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "crates/launcher/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # Ältere glibc als das Runner-Image, damit es auch auf Debian 12 und Ubuntu 22.04 läuft
    # Feste DNS-Server: am 11.11.2026 konnten Container auf den GitHub-Runnern
    # generell keine Namen mehr auflösen (dreimal hintereinander, neue Versuche halfen nicht)
    container:
      image: ubuntu:22.04
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Pakete
        run: |
          for i in 1 2 3 4 5; do
            if apt-get update -qq && apt-get install -y -qq build-essential ca-certificates curl dpkg-dev file git pkg-config zip \
              libasound2-dev libgl1-mesa-dev libx11-dev libxi-dev; then break; fi
            test "$i" = 5 && exit 1
            echo "apt fehlgeschlagen (Versuch $i), warte kurz"
            sleep $((i * 15))
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml ($version)"; exit 1; }
          grep -q "id=\"v$version\"" website/neuigkeiten.html || { echo "Version $version fehlt auf der Website: python3 scripts/export_releases.py"; exit 1; }
      - name: Tests
        run: cargo test --release --workspace --locked
      - name: Pakete bauen
        run: packaging/linux/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # Lässt sich das Paket auf den Systemen installieren, die die Website nennt?
  linux-install:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --dns 1.1.1.1 --dns 8.8.8.8
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist
      - name: Paket installieren und Bibliotheken prüfen
        run: |
          for i in 1 2 3 4 5; do
            if apt-get update -qq && apt-get install -y -qq unzip ./dist/panzer-launcher_amd64.deb; then break; fi
            test "$i" = 5 && exit 1
            echo "apt fehlgeschlagen (Versuch $i), warte kurz"
            sleep $((i * 15))
          done
          test -x /usr/bin/panzer-launcher
          test -f /usr/share/applications/panzer-launcher.desktop
          unzip -q dist/panzer-game-linux-x86_64.zip -d /tmp/game
          for bin in /usr/bin/panzer-launcher /tmp/game/panzer; do
            ldd "$bin"
            ! ldd "$bin" | grep -q "not found"
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Tests
        run: cargo test --release --workspace --locked
      - name: Pakete bauen
        run: packaging/macos/build.sh
      - name: Disk-Image prüfen
        run: |
          hdiutil attach dist/Panzer-macos-universal.dmg -nobrowse -mountpoint /tmp/panzer-dmg
          launcher=/tmp/panzer-dmg/Panzer.app/Contents/MacOS/panzer-launcher
          test -x "$launcher"
          test -L /tmp/panzer-dmg/Applications
          lipo "$launcher" -verify_arch x86_64 arm64
          codesign --verify --deep --strict /tmp/panzer-dmg/Panzer.app
          hdiutil detach /tmp/panzer-dmg
      - name: Startet der Server auf diesem Rechner?
        run: |
          unzip -q -o dist/panzer-server-macos-universal.zip -d target/smoke
          target/smoke/panzer-server --port 5599 & pid=$!
          sleep 2
          kill -0 "$pid"
          kill "$pid"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Tests
        run: cargo test --release --workspace --locked
      - name: Pakete bauen
        run: packaging\windows\build.ps1
      - name: Installer und Deinstallation prüfen
        run: |
          $setup = Start-Process dist\Panzer-Setup-windows-x86_64.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup: Exit-Code $($setup.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\Panzer"
          if (-not (Test-Path "$dir\panzer-launcher.exe")) { throw "Launcher fehlt" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Panzer.lnk")) { throw "Startmenü-Eintrag fehlt" }
          # So sieht der Datenordner aus, wenn der Launcher das Spiel geladen hat
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Panzer\game" | Out-Null
          $remove = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Deinstallation: Exit-Code $($remove.ExitCode)" }
          Start-Sleep -Seconds 5  # die Deinstallation läuft als Kopie im Temp-Ordner weiter
          if (Test-Path "$dir\panzer-launcher.exe") { throw "Launcher noch da" }
          if (Test-Path "$env:LOCALAPPDATA\Panzer") { throw "Datenordner noch da" }
      - name: Startet der Server auf diesem Rechner?
        run: |
          Expand-Archive dist\panzer-server-windows-x86_64.zip target\smoke -Force
          $server = Start-Process target\smoke\panzer-server.exe -ArgumentList '--port','5599' -PassThru
          Start-Sleep -Seconds 2
          if ($server.HasExited) { throw "Server hat sich beendet" }
          Stop-Process $server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-install, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Panzer ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
